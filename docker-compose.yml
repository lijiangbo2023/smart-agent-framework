services:
  smart-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: smart_agent
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_USE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-smart-agent-redis}
      LLM_API_KEY: ${LLM_API_KEY:-sk-your-key}
      AUTH_ENABLED: "true"
      AUTH_API_KEY: ${AUTH_API_KEY:-change-this-api-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.com}
      DINGTALK_STREAM_ENABLED: ${DINGTALK_STREAM_ENABLED:-false}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      RAG_EMBEDDING_MODEL: text-embedding-v3
      RAG_EMBEDDING_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SKILL_GIT_REPO_URL: ${SKILL_GIT_REPO_URL:-}
      SKILL_GIT_TOKEN: ${SKILL_GIT_TOKEN:-}
      SKILL_GIT_USERNAME: ${SKILL_GIT_USERNAME:-oauth2}
      SKILL_GIT_BRANCH: ${SKILL_GIT_BRANCH:-main}
      SKILL_LOCAL_DIR: ${SKILL_LOCAL_DIR:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: smart_agent
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-smart-agent-redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-smart-agent-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---- Milvus Vector Database ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    # Ports not exposed to host (internal Docker network only)

  # ---- Nacos Configuration Center ----
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    # Ports not exposed to host (internal Docker network only)
    # Access Nacos UI via: docker compose exec nacos curl http://localhost:8848/nacos
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  nacos-data:
