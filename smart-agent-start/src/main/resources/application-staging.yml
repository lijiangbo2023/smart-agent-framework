# ============================================================
# 预发环境 (staging)
# 与生产配置对齐，用于上线前验证
# ============================================================
server:
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:smart_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
  flyway:
    enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  api-key:
    enabled: true
    value: ${AUTH_API_KEY}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

skill:
  git:
    local-cache-dir: /tmp/smart-agent-skills-staging

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.smart.agent: INFO
    io.agentscope: INFO
