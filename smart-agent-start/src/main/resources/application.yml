server:
  port: 8080

spring:
  application:
    name: smart-agent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/smart_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}

# Druid 连接池配置
  druid:
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# LLM 配置 (DashScope)
llm:
  api-key: ${LLM_API_KEY:sk-your-dashscope-api-key}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  endpoint-path: /chat/completions
  # 子 Agent 使用单独的 API Key（可选，默认与主 Key 相同）
  # sub-api-key: sk-another-api-key

# Nacos 配置中心
nacos:
  config:
    server-addr: 127.0.0.1:8848
    namespace: ""
    group: smart-agent

# RAG 配置（可选）
rag:
  embedding:
    model: text-embedding-v3
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  milvus:
    uri: http://localhost:19530
    token: ""
    collection: knowledge_base
    dimension: 1024
    top-k: 5

# MCP 配置（可选）
# mcp:
#   server:
#     url: http://localhost:3000/sse
#     name: my-mcp-server

# Skill Git 仓库（可选）
# skill:
#   git:
#     repo-url: https://github.com/your-org/agent-skills.git
#     token: ghp_your_token
#     username: oauth2
#     branch: main
#     local-cache-dir: /tmp/smart-agent-skills

# DingTalk（可选，通过 Nacos system-config.json 配置）
# dingtalk:
#   stream:
#     app-key: your-app-key
#     app-secret: your-app-secret

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging (logback-spring.xml)
logging:
  level:
    com.smart.agent: INFO
    io.agentscope: INFO
  file:
    path: ${user.home}/smart-agent/logs
