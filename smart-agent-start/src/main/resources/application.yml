server:
  port: 8080

spring:
  application:
    name: smart-agent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

# Druid connection pool
  druid:
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# LLM (DashScope / OpenAI-compatible)
llm:
  api-key: ${LLM_API_KEY:sk-your-dashscope-api-key}
  base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  endpoint-path: ${LLM_ENDPOINT_PATH:/chat/completions}
  model: ${LLM_MODEL:qwen-max}
  fast-model: ${LLM_FAST_MODEL:qwen-turbo}
  light-model: ${LLM_LIGHT_MODEL:qwen-turbo}

# Nacos config center
nacos:
  config:
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:smart-agent}

# RAG (optional)
rag:
  embedding:
    model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    token: ${MILVUS_TOKEN:}
    collection: ${MILVUS_COLLECTION:knowledge_base}
    dimension: ${MILVUS_DIMENSION:1024}
    top-k: ${MILVUS_TOP_K:5}

# MCP (optional)
# mcp:
#   server:
#     url: ${MCP_SERVER_URL:http://localhost:3000/sse}
#     name: ${MCP_SERVER_NAME:my-mcp-server}

# Skill Git repository (optional)
# skill:
#   git:
#     repo-url: ${SKILL_GIT_REPO_URL:}
#     token: ${SKILL_GIT_TOKEN:}
#     username: oauth2
#     branch: main
#     local-cache-dir: /tmp/smart-agent-skills

# DingTalk Stream
dingtalk:
  stream:
    enabled: ${DINGTALK_STREAM_ENABLED:false}

# Scheduled data cleanup (daily at 3:00 AM)
cleanup:
  session:
    retention-days: ${CLEANUP_SESSION_RETENTION_DAYS:7}
  message:
    retention-days: ${CLEANUP_MESSAGE_RETENTION_DAYS:90}

# Redis (optional)
redis:
  host: ${REDIS_HOST:}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

# API rate limiting (requires Redis)
ratelimit:
  requests-per-minute: ${RATELIMIT_REQUESTS_PER_MINUTE:30}
  trusted-proxy-header: ${RATELIMIT_TRUSTED_PROXY:false}

# Authentication (disabled by default for development)
auth:
  api-key:
    enabled: ${AUTH_ENABLED:false}
    value: ${AUTH_API_KEY:}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Concurrent sync chat limit (set 0 to disable)
chat:
  max-concurrent-sync: ${CHAT_MAX_CONCURRENT_SYNC:20}

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

# Logging (logback-spring.xml)
logging:
  level:
    com.smart.agent: INFO
    io.agentscope: INFO
  file:
    path: ${LOG_PATH:${user.home}/smart-agent/logs}
